name: Sync SRD 5.2 Items

on:
  push:
    paths:
      - "scripts/import-srd52-items.mjs"
      - "scripts/enrich-srd52-items.mjs"
      - "scripts/normalize-srd52-item-units.mjs"
      - "scripts/audit-srd52-item-coverage.mjs"
      - "scripts/probe-srd52-item-fields.mjs"
      - "packages/schema/src/item.ts"
      - "packages/schema/src/inventory.ts"
      - "packages/schema/src/activity.ts"
      - "packages/schema/src/enums.ts"
      - ".github/workflows/sync-srd52-items.yml"
  pull_request:
    paths:
      - "scripts/import-srd52-items.mjs"
      - "scripts/enrich-srd52-items.mjs"
      - "scripts/normalize-srd52-item-units.mjs"
      - "scripts/audit-srd52-item-coverage.mjs"
      - "scripts/probe-srd52-item-fields.mjs"
      - "packages/schema/src/item.ts"
      - "packages/schema/src/inventory.ts"
      - "packages/schema/src/activity.ts"
      - "packages/schema/src/enums.ts"
      - ".github/workflows/sync-srd52-items.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate canonical SRD item compendium
        id: importer
        continue-on-error: true
        run: node scripts/import-srd52-items.mjs
      - name: Enrich discovered structured mechanics
        id: enricher
        if: steps.importer.outcome == 'success'
        continue-on-error: true
        run: node scripts/enrich-srd52-items.mjs
      - name: Normalize physical units
        id: units
        if: steps.importer.outcome == 'success' && steps.enricher.outcome == 'success'
        continue-on-error: true
        run: node scripts/normalize-srd52-item-units.mjs
      - name: Compare 5etools and Oracle structural coverage
        id: coverage
        if: steps.importer.outcome == 'success' && steps.enricher.outcome == 'success' && steps.units.outcome == 'success'
        continue-on-error: true
        run: node scripts/audit-srd52-item-coverage.mjs
      - name: Probe structured field shapes
        if: always()
        run: node scripts/probe-srd52-item-fields.mjs
      - name: Upload generated compendium and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srd52-items
          path: packages/content/data/srd-5.2
      - name: Commit generated compendium
        if: github.event_name == 'push' && steps.importer.outcome == 'success' && steps.enricher.outcome == 'success' && steps.units.outcome == 'success' && steps.coverage.outcome == 'success'
        run: |
          if [ -z "$(git status --porcelain -- packages/content/data/srd-5.2)" ]; then
            echo "No content changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/content/data/srd-5.2
          git commit -m "Populate SRD 5.2 item compendium"
          git push
      - name: Fail on import or coverage diagnostics
        if: steps.importer.outcome != 'success' || steps.enricher.outcome != 'success' || steps.units.outcome != 'success' || steps.coverage.outcome != 'success'
        run: exit 1
