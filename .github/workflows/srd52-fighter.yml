name: SRD 5.2 Fighter

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fighter:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install YAML comparison dependency
        run: npm install yaml@2 --no-save --ignore-scripts
      - name: Checkout Foundry D&D reference
        run: git clone --depth 1 --branch 6.0.x https://github.com/foundryvtt/dnd5e.git ../foundry-dnd5e
      - name: Import Fighter from 5etools SRD 5.2
        run: node scripts/import-srd52-fighter.mjs
      - name: Normalize Fighter references
        run: node scripts/patch-srd52-fighter.mjs
      - name: Audit Fighter and Champion
        run: node scripts/audit-srd52-fighter.mjs
      - name: Compare 5etools to Oracle
        run: node scripts/compare-5etools-srd52-fighter.mjs
      - name: Compare Foundry to Oracle
        run: node scripts/compare-foundry-srd52-fighter.mjs ../foundry-dnd5e/packs/_source/classes24/fighter
      - name: Resolve class media
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-srd52-media.mjs
          node scripts/finalize-srd52-media.mjs
      - name: Verify Fighter outputs
        run: |
          node - <<'NODE'
          const fs=require('fs'),root='packages/content/data/srd-5.2',read=f=>JSON.parse(fs.readFileSync(`${root}/${f}`,'utf8'));
          const cls=read('classes.json'),subs=read('subclasses.json'),features=read('class-features.json');
          const fighter=cls.items.find(x=>x.name==='Fighter'),champ=subs.items.find(x=>x.name==='Champion'&&x.data?.parentClass?.name==='Fighter');
          for(const f of ['fighter-coverage-audit.json','fighter-5etools-comparison.json','fighter-foundry-comparison.json']){const a=read(f);if(a.status!=='SUPPORTED'||a.issues?.length)throw new Error(JSON.stringify(a));}
          if(!fighter||!champ||fighter.data.advancement.length!==20)throw new Error('Fighter/Champion invalid');
          if(cls.count<5||subs.count<5)throw new Error(`Expected at least 5 cumulative classes/subclasses, got ${cls.count}/${subs.count}`);
          for(const n of ['Barbarian','Bard','Cleric','Druid','Fighter'])if(!cls.items.some(x=>x.name===n))throw new Error(`Cumulative class missing: ${n}`);
          const ff=features.items.filter(x=>x.data?.category==='fighter'),cf=features.items.filter(x=>x.data?.category==='fighter-champion');
          if(!ff.find(x=>x.name==='Second Wind')||!ff.find(x=>x.name==='Weapon Mastery')||!cf.find(x=>x.name==='Survivor'))throw new Error('Core Fighter/Champion mechanics missing');
          console.log(JSON.stringify({classes:cls.count,subclasses:subs.count,classFeatures:features.count,fighterFeatures:ff.length,championFeatures:cf.length,status:'SUPPORTED'},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: srd52-fighter
          path: |
            packages/content/data/srd-5.2/classes.json
            packages/content/data/srd-5.2/class-features.json
            packages/content/data/srd-5.2/subclasses.json
            packages/content/data/srd-5.2/fighter-import-report.json
            packages/content/data/srd-5.2/fighter-coverage-audit.json
            packages/content/data/srd-5.2/fighter-5etools-comparison.json
            packages/content/data/srd-5.2/fighter-foundry-comparison.json
            packages/content/data/srd-5.2/media-coverage-audit.json
      - name: Persist Fighter compendium on PR branch
        if: github.event_name == 'pull_request' && github.head_ref == 'work/srd52-fighter'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/content/data/srd-5.2/classes.json packages/content/data/srd-5.2/class-features.json packages/content/data/srd-5.2/subclasses.json packages/content/data/srd-5.2/fighter-import-report.json packages/content/data/srd-5.2/fighter-coverage-audit.json packages/content/data/srd-5.2/fighter-5etools-comparison.json packages/content/data/srd-5.2/fighter-foundry-comparison.json packages/content/data/srd-5.2/media-coverage-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist SRD 5.2 Fighter compendium [skip ci]'
            git push origin HEAD:${{ github.head_ref }}
          fi
