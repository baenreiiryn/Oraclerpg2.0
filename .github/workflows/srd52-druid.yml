name: SRD 5.2 Druid

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  druid:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install YAML comparison dependency
        run: npm install yaml@2 --no-save --ignore-scripts
      - name: Checkout Foundry D&D reference
        run: git clone --depth 1 --branch 6.0.x https://github.com/foundryvtt/dnd5e.git ../foundry-dnd5e
      - name: Import Druid from 5etools SRD 5.2
        run: |
          node scripts/import-srd52-druid.mjs
          node scripts/patch-srd52-druid.mjs
      - name: Audit Druid and Wild Shape
        run: node scripts/audit-srd52-druid.mjs
      - name: Compare 5etools to Oracle
        run: node scripts/compare-5etools-srd52-druid.mjs
      - name: Compare Foundry to Oracle
        run: node scripts/compare-foundry-srd52-druid.mjs ../foundry-dnd5e/packs/_source/classes24/druid
      - name: Resolve class media
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-srd52-media.mjs
          node scripts/finalize-srd52-media.mjs
      - name: Verify Druid outputs
        run: |
          node - <<'NODE'
          const fs=require('fs'),root='packages/content/data/srd-5.2',read=f=>JSON.parse(fs.readFileSync(`${root}/${f}`,'utf8'));
          const cls=read('classes.json'),subs=read('subclasses.json'),features=read('class-features.json');
          const druid=cls.items.find(x=>x.name==='Druid'),land=subs.items.find(x=>x.name==='Circle of the Land'),wild=features.items.find(x=>x.name==='Wild Shape'&&x.data?.category==='druid');
          for(const f of ['druid-coverage-audit.json','druid-5etools-comparison.json','druid-foundry-comparison.json']){const a=read(f);if(a.status!=='SUPPORTED'||a.issues?.length)throw new Error(JSON.stringify(a));}
          if(!druid||!land||druid.data.advancement.length!==20||!wild?.data?.classMechanics?.transformations?.length||!wild?.data?.classRules?.entityCollections?.length)throw new Error('Druid/Land/Wild Shape invalid');
          if(cls.count!==4||subs.count!==4)throw new Error(`Expected cumulative 4 classes/subclasses, got ${cls.count}/${subs.count}`);
          console.log(JSON.stringify({classes:cls.count,subclasses:subs.count,classFeatures:features.count,druid:true,land:true,wildShape:true,status:'SUPPORTED'},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: srd52-druid
          path: |
            packages/content/data/srd-5.2/classes.json
            packages/content/data/srd-5.2/class-features.json
            packages/content/data/srd-5.2/subclasses.json
            packages/content/data/srd-5.2/druid-import-report.json
            packages/content/data/srd-5.2/druid-coverage-audit.json
            packages/content/data/srd-5.2/druid-5etools-comparison.json
            packages/content/data/srd-5.2/druid-foundry-comparison.json
            packages/content/data/srd-5.2/media-coverage-audit.json
      - name: Persist Druid compendium on PR branch
        if: github.event_name == 'pull_request' && github.head_ref == 'work/srd52-druid'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/content/data/srd-5.2/classes.json packages/content/data/srd-5.2/class-features.json packages/content/data/srd-5.2/subclasses.json packages/content/data/srd-5.2/druid-import-report.json packages/content/data/srd-5.2/druid-coverage-audit.json packages/content/data/srd-5.2/druid-5etools-comparison.json packages/content/data/srd-5.2/druid-foundry-comparison.json packages/content/data/srd-5.2/media-coverage-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist SRD 5.2 Druid compendium [skip ci]'
            git push origin HEAD:${{ github.head_ref }}
          fi
