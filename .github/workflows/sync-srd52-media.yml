name: Sync SRD 5.2 Media

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve 5etools media assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-srd52-media.mjs
      - name: Validate media model and coverage
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const root='packages/content/data/srd-5.2';
          const audit=JSON.parse(fs.readFileSync(`${root}/media-coverage-audit.json`,'utf8'));
          if(!audit.totals.entities) throw new Error('No entities were audited');
          if(!audit.totals.withMedia) throw new Error('No upstream media assets were resolved');
          for(const [file,stats] of Object.entries(audit.collections)){
            const doc=JSON.parse(fs.readFileSync(`${root}/${file}`,'utf8'));
            for(const entity of doc.items??[]){
              if(!entity.media) continue;
              if(!Array.isArray(entity.media.assets)||!entity.media.assets.length) throw new Error(`${entity.name}: empty media assets`);
              for(const asset of entity.media.assets){
                if(!['icon','portrait','token','artwork','thumbnail'].includes(asset.role)) throw new Error(`${entity.name}: invalid role ${asset.role}`);
                if(asset.provider!=='5etools-img') throw new Error(`${entity.name}: unexpected provider`);
                if(!asset.sourceUrl.startsWith('https://raw.githubusercontent.com/')) throw new Error(`${entity.name}: invalid source URL`);
                if(asset.storagePolicy!=='mirrorOnDemand') throw new Error(`${entity.name}: invalid storage policy`);
              }
            }
            if(stats.withMedia>stats.entities) throw new Error(`${file}: invalid coverage`);
          }
          console.log(JSON.stringify({totals:audit.totals,coverage:audit.coverage,unmatched:audit.unmatched.length},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: srd52-media-enriched
          path: |
            packages/content/data/srd-5.2/items.json
            packages/content/data/srd-5.2/spells.json
            packages/content/data/srd-5.2/monsters.json
            packages/content/data/srd-5.2/monster-features.json
            packages/content/data/srd-5.2/species.json
            packages/content/data/srd-5.2/species-features.json
            packages/content/data/srd-5.2/feats.json
            packages/content/data/srd-5.2/media-coverage-audit.json
