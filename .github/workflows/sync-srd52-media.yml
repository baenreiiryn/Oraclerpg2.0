name: SRD 5.2 Media Audit

on:
  pull_request:
    paths:
      - 'packages/content/data/srd-5.2/**'
      - 'scripts/sync-srd52-media.mjs'
      - 'scripts/finalize-srd52-media.mjs'
      - '.github/workflows/sync-srd52-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve media against current compendium
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-srd52-media.mjs
          node scripts/finalize-srd52-media.mjs
      - name: Validate media model and coverage
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const root='packages/content/data/srd-5.2';
          const audit=JSON.parse(fs.readFileSync(`${root}/media-coverage-audit.json`,'utf8'));
          const required=['items.json','spells.json','monsters.json','monster-features.json','species.json','species-features.json','feats.json','classes.json','subclasses.json','class-features.json'];
          for(const file of required){
            if(!fs.existsSync(`${root}/${file}`))throw new Error(`${file}: compendium missing`);
            if(!audit.collections[file])throw new Error(`${file}: missing from media audit`);
            const doc=JSON.parse(fs.readFileSync(`${root}/${file}`,'utf8'));
            if(audit.collections[file].entities!==doc.count)throw new Error(`${file}: media count mismatch ${audit.collections[file].entities}/${doc.count}`);
            for(const entity of doc.items??[]){
              if(!entity.media)continue;
              if(!Array.isArray(entity.media.assets)||!entity.media.assets.length)throw new Error(`${entity.name}: empty media assets`);
              const ids=new Set();
              for(const asset of entity.media.assets){
                if(ids.has(asset.id))throw new Error(`${entity.name}: duplicate media id ${asset.id}`);ids.add(asset.id);
                if(!['icon','portrait','token','artwork','thumbnail'].includes(asset.role))throw new Error(`${entity.name}: invalid media role`);
                if(asset.provider!=='5etools-img'||asset.storagePolicy!=='mirrorOnDemand')throw new Error(`${entity.name}: invalid media provenance`);
                if((asset.role==='token'||asset.role==='portrait')&&entity.entityType!=='monster')throw new Error(`${entity.name}: creature-only media role on ${entity.entityType}`);
              }
            }
          }
          if(!audit.safeguards?.monsterFeatureBestiaryArtworkBlocked)throw new Error('Monster-feature artwork safeguard missing');
          if(audit.collections['monster-features.json'].withMedia!==0)throw new Error('Monster Features must not inherit Bestiary artwork');
          console.log(JSON.stringify({totals:audit.totals,coverage:audit.coverage,collections:Object.fromEntries(required.map(f=>[f,audit.collections[f]]))},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: srd52-media-audit
          path: packages/content/data/srd-5.2/media-coverage-audit.json
      - name: Persist media only on manual branch run
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/content/data/srd-5.2/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist SRD 5.2 media enrichment [skip ci]'
            git push origin HEAD:${{ github.ref_name }}
          fi
