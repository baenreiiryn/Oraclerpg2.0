name: SRD 5.2 Bard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install YAML comparison dependency
        run: npm install yaml@2 --no-save --ignore-scripts
      - name: Checkout Foundry D&D reference
        run: git clone --depth 1 --branch 6.0.x https://github.com/foundryvtt/dnd5e.git ../foundry-dnd5e
      - name: Import Bard from 5etools SRD 5.2
        run: node scripts/import-srd52-bard.mjs
      - name: Audit Bard structure
        run: node scripts/audit-srd52-bard.mjs
      - name: Compare 5etools to Oracle
        run: node scripts/compare-5etools-srd52-bard.mjs
      - name: Compare Foundry to Oracle
        run: node scripts/compare-foundry-srd52-bard.mjs ../foundry-dnd5e/packs/_source/classes24/bard
      - name: Resolve class media
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-srd52-media.mjs
          node scripts/finalize-srd52-media.mjs
      - name: Verify Bard outputs
        run: |
          node - <<'NODE'
          const fs=require('fs');const root='packages/content/data/srd-5.2';const read=f=>JSON.parse(fs.readFileSync(`${root}/${f}`,'utf8'));
          const cls=read('classes.json').items.find(x=>x.name==='Bard');const sub=read('subclasses.json').items.find(x=>x.name==='College of Lore');const feats=read('class-features.json').items.filter(x=>x.data?.category==='bard'||x.data?.category==='bard-lore');
          const audits=['bard-coverage-audit.json','bard-5etools-comparison.json','bard-foundry-comparison.json'].map(read);
          if(!cls||!sub)throw new Error('Bard/Lore missing');if(cls.data.advancement.length!==20)throw new Error('Bard progression incomplete');if(feats.length<13)throw new Error(`Too few Bard feature definitions: ${feats.length}`);for(const a of audits)if(a.status!=='SUPPORTED'||a.issues?.length)throw new Error(JSON.stringify(a));
          console.log(JSON.stringify({bard:true,lore:true,features:feats.length,status:'SUPPORTED'},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: srd52-bard
          path: |
            packages/content/data/srd-5.2/classes.json
            packages/content/data/srd-5.2/class-features.json
            packages/content/data/srd-5.2/subclasses.json
            packages/content/data/srd-5.2/bard-import-report.json
            packages/content/data/srd-5.2/bard-coverage-audit.json
            packages/content/data/srd-5.2/bard-5etools-comparison.json
            packages/content/data/srd-5.2/bard-foundry-comparison.json
            packages/content/data/srd-5.2/media-coverage-audit.json
      - name: Persist Bard compendium on PR branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/content/data/srd-5.2/classes.json packages/content/data/srd-5.2/class-features.json packages/content/data/srd-5.2/subclasses.json packages/content/data/srd-5.2/bard-import-report.json packages/content/data/srd-5.2/bard-coverage-audit.json packages/content/data/srd-5.2/bard-5etools-comparison.json packages/content/data/srd-5.2/bard-foundry-comparison.json packages/content/data/srd-5.2/media-coverage-audit.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m 'Persist SRD 5.2 Bard compendium [skip ci]'
            git fetch origin ${{ github.head_ref }}
            git rebase origin/${{ github.head_ref }}
            git push origin HEAD:${{ github.head_ref }}
          fi
