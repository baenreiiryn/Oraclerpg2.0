name: Verify Monster Feature Compendium

on:
  push:
    paths:
      - "packages/content/data/srd-5.2/monster-features.json"
      - "packages/schema/src/monster-feature.ts"
      - "packages/schema/src/activity.ts"
      - "scripts/normalize-srd52-monster-feature-templates.mjs"
      - "scripts/verify-srd52-monster-feature-templates.mjs"
      - ".github/workflows/verify-monster-features.yml"
  pull_request:
    paths:
      - "packages/content/data/srd-5.2/monster-features.json"
      - "packages/schema/src/monster-feature.ts"
      - "packages/schema/src/activity.ts"
      - "scripts/normalize-srd52-monster-feature-templates.mjs"
      - "scripts/verify-srd52-monster-feature-templates.mjs"
      - ".github/workflows/verify-monster-features.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install
      - name: Normalize reusable templates
        run: node scripts/normalize-srd52-monster-feature-templates.mjs
      - name: Build schema
        run: pnpm --filter @oraclerpg/schema build
      - name: Verify reusable monster feature templates
        run: node scripts/verify-srd52-monster-feature-templates.mjs
      - name: Commit normalized compendium
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain -- packages/content/data/srd-5.2/monster-features.json)" ]; then
            echo "No normalized content changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/content/data/srd-5.2/monster-features.json
          git commit -m "Normalize SRD 5.2 monster feature compendium"
          git push
