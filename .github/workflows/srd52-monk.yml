name: SRD 5.2 Monk

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install YAML comparison dependency
        run: npm install yaml@2 --no-save --ignore-scripts
      - name: Checkout Foundry D&D reference
        run: git clone --depth 1 --branch 6.0.x https://github.com/foundryvtt/dnd5e.git ../foundry-dnd5e
      - name: Import Monk from 5etools SRD 5.2
        run: node scripts/import-srd52-monk.mjs
      - name: Audit Monk and Open Hand
        run: node scripts/audit-srd52-monk.mjs
      - name: Compare 5etools to Oracle
        run: node scripts/compare-5etools-srd52-monk.mjs
      - name: Compare Foundry to Oracle
        run: node scripts/compare-foundry-srd52-monk.mjs ../foundry-dnd5e/packs/_source/classes24/monk
      - name: Resolve class media
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-srd52-media.mjs
          node scripts/finalize-srd52-media.mjs
      - name: Verify Monk outputs
        run: |
          node - <<'NODE'
          const fs=require('fs'),root='packages/content/data/srd-5.2',read=f=>JSON.parse(fs.readFileSync(`${root}/${f}`,'utf8'));
          const cls=read('classes.json'),subs=read('subclasses.json'),features=read('class-features.json');
          const monk=cls.items.find(x=>x.name==='Monk'),open=subs.items.find(x=>x.name==='Warrior of the Open Hand'&&x.data?.parentClass?.name==='Monk');
          for(const f of ['monk-coverage-audit.json','monk-5etools-comparison.json','monk-foundry-comparison.json']){const a=read(f);if(a.status!=='SUPPORTED'||a.issues?.length)throw new Error(JSON.stringify(a));}
          if(!monk||!open||monk.data.advancement.length!==20)throw new Error('Monk/Open Hand invalid');
          if(cls.count<6||subs.count<6)throw new Error(`Expected at least 6 cumulative classes/subclasses, got ${cls.count}/${subs.count}`);
          const mf=features.items.filter(x=>x.data?.category==='monk'),of=features.items.filter(x=>x.data?.category==='monk-open-hand');
          if(!mf.find(x=>x.name==='Unarmored Defense')||!mf.find(x=>x.name==="Monk's Focus")||!of.find(x=>x.name==='Quivering Palm'))throw new Error('Core Monk/Open Hand mechanics missing');
          console.log(JSON.stringify({classes:cls.count,subclasses:subs.count,classFeatures:features.count,monkFeatures:mf.length,openHandFeatures:of.length,status:'SUPPORTED'},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: srd52-monk
          path: |
            packages/content/data/srd-5.2/classes.json
            packages/content/data/srd-5.2/class-features.json
            packages/content/data/srd-5.2/subclasses.json
            packages/content/data/srd-5.2/monk-import-report.json
            packages/content/data/srd-5.2/monk-coverage-audit.json
            packages/content/data/srd-5.2/monk-5etools-comparison.json
            packages/content/data/srd-5.2/monk-foundry-comparison.json
            packages/content/data/srd-5.2/media-coverage-audit.json
      - name: Persist Monk compendium on PR branch
        if: github.event_name == 'pull_request' && github.head_ref == 'work/srd52-monk'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/content/data/srd-5.2/classes.json packages/content/data/srd-5.2/class-features.json packages/content/data/srd-5.2/subclasses.json packages/content/data/srd-5.2/monk-import-report.json packages/content/data/srd-5.2/monk-coverage-audit.json packages/content/data/srd-5.2/monk-5etools-comparison.json packages/content/data/srd-5.2/monk-foundry-comparison.json packages/content/data/srd-5.2/media-coverage-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist SRD 5.2 Monk compendium [skip ci]'
            git push origin HEAD:${{ github.head_ref }}
          fi
