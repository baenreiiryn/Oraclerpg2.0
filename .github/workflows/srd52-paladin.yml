name: SRD 5.2 Paladin

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/import-srd52-paladin.mjs'
      - 'scripts/normalize-srd52-paladin.mjs'
      - 'scripts/audit-srd52-paladin.mjs'
      - 'scripts/compare-5etools-srd52-paladin.mjs'
      - 'scripts/compare-foundry-srd52-paladin.mjs'
      - '.github/workflows/srd52-paladin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paladin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install YAML comparison dependency
        run: npm install yaml@2 --no-save --ignore-scripts
      - name: Checkout Foundry D&D reference
        run: git clone --depth 1 --branch 6.0.x https://github.com/foundryvtt/dnd5e.git ../foundry-dnd5e
      - name: Import Paladin from 5etools SRD 5.2
        run: node scripts/import-srd52-paladin.mjs
      - name: Normalize Paladin source semantics
        run: node scripts/normalize-srd52-paladin.mjs
      - name: Audit Paladin and Oath of Devotion
        run: node scripts/audit-srd52-paladin.mjs
      - name: Compare 5etools to Oracle
        run: node scripts/compare-5etools-srd52-paladin.mjs
      - name: Compare Foundry to Oracle
        run: node scripts/compare-foundry-srd52-paladin.mjs ../foundry-dnd5e/packs/_source/classes24/paladin
      - name: Resolve class media
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-srd52-media.mjs
          node scripts/finalize-srd52-media.mjs
      - name: Verify Paladin outputs
        run: |
          node - <<'NODE'
          const fs=require('fs'),root='packages/content/data/srd-5.2',read=f=>JSON.parse(fs.readFileSync(`${root}/${f}`,'utf8'));
          const cls=read('classes.json'),subs=read('subclasses.json'),features=read('class-features.json');
          const paladin=cls.items.find(x=>x.name==='Paladin'),devotion=subs.items.find(x=>x.name==='Oath of Devotion'&&x.data?.parentClass?.name==='Paladin');
          for(const f of ['paladin-coverage-audit.json','paladin-5etools-comparison.json','paladin-foundry-comparison.json']){const a=read(f);if(a.status!=='SUPPORTED'||a.issues?.length)throw new Error(JSON.stringify(a));}
          if(!paladin||!devotion||paladin.data.advancement.length!==20)throw new Error('Paladin/Oath of Devotion invalid');
          const pf=features.items.filter(x=>x.data?.category==='paladin'),df=features.items.filter(x=>x.data?.category==='paladin-devotion');
          if(!pf.find(x=>x.name.toLowerCase()==='lay on hands')||!pf.find(x=>x.name==='Aura of Protection')||!df.find(x=>x.name==='Holy Nimbus')||!df.find(x=>x.name==='Oath of Devotion Spells'))throw new Error('Core Paladin/Devotion mechanics missing');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: srd52-paladin
          path: |
            packages/content/data/srd-5.2/classes.json
            packages/content/data/srd-5.2/class-features.json
            packages/content/data/srd-5.2/subclasses.json
            packages/content/data/srd-5.2/paladin-import-report.json
            packages/content/data/srd-5.2/paladin-coverage-audit.json
            packages/content/data/srd-5.2/paladin-5etools-comparison.json
            packages/content/data/srd-5.2/paladin-foundry-comparison.json
            packages/content/data/srd-5.2/media-coverage-audit.json
      - name: Persist Paladin compendium on PR branch
        if: github.event_name == 'pull_request' && github.head_ref == 'work/srd52-paladin'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/content/data/srd-5.2/classes.json packages/content/data/srd-5.2/class-features.json packages/content/data/srd-5.2/subclasses.json packages/content/data/srd-5.2/paladin-import-report.json packages/content/data/srd-5.2/paladin-coverage-audit.json packages/content/data/srd-5.2/paladin-5etools-comparison.json packages/content/data/srd-5.2/paladin-foundry-comparison.json packages/content/data/srd-5.2/media-coverage-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist SRD 5.2 Paladin compendium [skip ci]'
            git push origin HEAD:${{ github.head_ref }}
          fi
