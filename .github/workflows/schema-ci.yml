name: Schema CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Public repository security gate
        run: pnpm security:audit
      - run: pnpm typecheck
      - run: pnpm test
      - name: AI-1 to AI-10 release gate
        run: node scripts/audit-ai-release-gate.mjs
