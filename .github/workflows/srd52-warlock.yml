name: SRD 5.2 Warlock

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/import-srd52-warlock.mjs'
      - 'scripts/audit-srd52-warlock.mjs'
      - 'scripts/compare-5etools-srd52-warlock.mjs'
      - 'scripts/compare-foundry-srd52-warlock.mjs'
      - '.github/workflows/srd52-warlock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  warlock:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'work/srd52-warlock')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install YAML comparison dependency
        run: npm install yaml@2 --no-save --ignore-scripts
      - name: Checkout Foundry D&D 2024 architecture reference
        run: git clone --depth 1 --branch 6.0.x https://github.com/foundryvtt/dnd5e.git ../foundry-dnd5e
      - name: Consolidate validated Sorcerer onto cumulative compendium
        run: |
          curl -fsSL https://raw.githubusercontent.com/baenreiiryn/Oraclerpg2.0/work/srd52-sorcerer/scripts/import-srd52-sorcerer.mjs -o /tmp/import-srd52-sorcerer.mjs
          node /tmp/import-srd52-sorcerer.mjs
      - name: Import Warlock from 5etools SRD 5.2
        run: node scripts/import-srd52-warlock.mjs
      - name: Audit Warlock and Fiend Patron structure
        run: node scripts/audit-srd52-warlock.mjs
      - name: Compare imported Warlock with 5etools source
        run: node scripts/compare-5etools-srd52-warlock.mjs
      - name: Compare Oracle architecture with Foundry Warlock
        run: node scripts/compare-foundry-srd52-warlock.mjs ../foundry-dnd5e/packs/_source/classes24/warlock
      - name: Verify Warlock outputs and cumulative class set
        run: |
          node - <<'NODE'
          const fs=require('fs'),root='packages/content/data/srd-5.2',read=f=>JSON.parse(fs.readFileSync(`${root}/${f}`,'utf8'));
          for(const f of ['warlock-coverage-audit.json','warlock-5etools-comparison.json','warlock-foundry-comparison.json']){const a=read(f);if(a.status!=='SUPPORTED'||a.issues?.length)throw new Error(`${f}: ${JSON.stringify(a)}`)}
          const cls=read('classes.json'),subs=read('subclasses.json');
          for(const n of ['Rogue','Sorcerer','Warlock'])if(!cls.items.some(x=>x.name===n))throw new Error(`Cumulative class missing: ${n}`);
          if(!subs.items.some(x=>x.name==='Fiend Patron'&&x.data?.parentClass?.name==='Warlock'))throw new Error('Fiend Patron missing');
          console.log(JSON.stringify({classes:cls.count,subclasses:subs.count,status:'SUPPORTED'},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: srd52-warlock
          path: |
            packages/content/data/srd-5.2/classes.json
            packages/content/data/srd-5.2/subclasses.json
            packages/content/data/srd-5.2/class-features.json
            packages/content/data/srd-5.2/warlock-import-report.json
            packages/content/data/srd-5.2/warlock-coverage-audit.json
            packages/content/data/srd-5.2/warlock-5etools-comparison.json
            packages/content/data/srd-5.2/warlock-foundry-comparison.json
      - name: Persist cumulative Sorcerer + Warlock compendium on Warlock branch
        if: github.event_name == 'pull_request' && github.head_ref == 'work/srd52-warlock'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/content/data/srd-5.2/classes.json packages/content/data/srd-5.2/subclasses.json packages/content/data/srd-5.2/class-features.json packages/content/data/srd-5.2/warlock-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist cumulative SRD 5.2 Warlock compendium [skip ci]'
            git push origin HEAD:${{ github.head_ref }}
          fi
