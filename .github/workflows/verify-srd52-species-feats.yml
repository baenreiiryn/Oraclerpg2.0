name: Verify SRD 5.2 Species and Feats

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and enrich species and feats
        run: |
          node scripts/sync-srd52-species-feats.mjs
          node scripts/normalize-srd52-species-feats.mjs
          node scripts/enrich-srd52-species-feats.mjs
          node scripts/finalize-srd52-species-feats.mjs
          node scripts/postprocess-srd52-species-feats.mjs
      - name: Coverage and semantic assertions
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('packages/content/data/srd-5.2/species-feats-coverage-audit.json','utf8'));
          const s=JSON.parse(fs.readFileSync('packages/content/data/srd-5.2/species-feats-semantic-audit.json','utf8'));
          const species=JSON.parse(fs.readFileSync('packages/content/data/srd-5.2/species.json','utf8'));
          const feats=JSON.parse(fs.readFileSync('packages/content/data/srd-5.2/feats.json','utf8'));
          if(a.speciesCount!==9) throw new Error(`Expected 9 species, got ${a.speciesCount}`);
          if(a.featCount!==17) throw new Error(`Expected 17 feats, got ${a.featCount}`);
          if(!a.allSpeciesHaveFeatures||!a.allFeatsCategorized) throw new Error('Coverage assertions failed');
          if(s.unstructuredSpeciesFeatures.length) throw new Error(`Unstructured species features: ${s.unstructuredSpeciesFeatures.join(', ')}`);
          if(s.unstructuredFeats.length) throw new Error(`Unstructured feats: ${s.unstructuredFeats.join(', ')}`);
          if(!s.magicInitiateChoiceCorrect||!s.abilityScoreImprovementChoiceCorrect) throw new Error('Feat choice semantics failed');
          if(s.goliathVariantGrants!==6) throw new Error(`Expected 6 Goliath ancestry grants, got ${s.goliathVariantGrants}`);
          for(const x of species.items){ if(x.data.variants?.length && x.data.spellGrants) throw new Error(`${x.name} leaks variant spell grants onto base species`); }
          const mi=feats.items.find(x=>x.name==='Magic Initiate');
          if(mi.data.spellGrantChoices?.length!==1) throw new Error('Magic Initiate must choose one spell list');
          for(const opt of mi.data.spellGrantChoices[0].options){ if(!opt.selections.some(x=>x.mode==='prepared'&&/level=1/.test(x.query||''))) throw new Error(`${opt.name} level-1 choice is not prepared`); }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: srd52-species-feats-generated
          path: |
            packages/content/data/srd-5.2/species.json
            packages/content/data/srd-5.2/species-features.json
            packages/content/data/srd-5.2/feats.json
            packages/content/data/srd-5.2/species-feats-coverage-audit.json
            packages/content/data/srd-5.2/species-feats-semantic-audit.json
