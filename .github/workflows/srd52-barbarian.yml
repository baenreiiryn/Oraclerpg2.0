name: SRD 5.2 Barbarian

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  barbarian:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install YAML comparison dependency
        run: npm install yaml@2 --no-save --ignore-scripts
      - name: Checkout Foundry D&D reference
        run: git clone --depth 1 --branch 6.0.x https://github.com/foundryvtt/dnd5e.git ../foundry-dnd5e
      - name: Import Barbarian from 5etools SRD 5.2
        run: node scripts/import-srd52-barbarian.mjs
      - name: Compare 5etools to Oracle
        run: node scripts/compare-5etools-srd52-barbarian.mjs
      - name: Compare Foundry to Oracle
        run: node scripts/compare-foundry-srd52-barbarian.mjs ../foundry-dnd5e/packs/_source/classes24/barbarian
      - name: Resolve class media
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-srd52-media.mjs
          node scripts/finalize-srd52-media.mjs
      - name: Verify Barbarian outputs
        run: |
          node - <<'NODE'
          const fs=require('fs'); const root='packages/content/data/srd-5.2';
          const read=f=>JSON.parse(fs.readFileSync(`${root}/${f}`,'utf8'));
          const cls=read('classes.json'), features=read('class-features.json'), subs=read('subclasses.json');
          const cov=read('barbarian-coverage-audit.json'), five=read('barbarian-5etools-comparison.json'), foundry=read('barbarian-foundry-comparison.json');
          if(cls.count!==1||cls.items[0].name!=='Barbarian') throw new Error('Barbarian class output invalid');
          if(subs.count!==1||subs.items[0].name!=='Path of the Berserker') throw new Error('Berserker output invalid');
          if(features.count!==23) throw new Error(`Expected 23 feature definitions, got ${features.count}`);
          for(const x of [cov,five,foundry]) if(x.status!=='SUPPORTED'||x.issues?.length) throw new Error(JSON.stringify(x));
          const required=['Rage','Reckless Attack','Brutal Strike','Relentless Rage','Primal Champion','Frenzy','Intimidating Presence'];
          for(const n of required) if(!features.items.some(x=>x.name===n)) throw new Error(`Missing ${n}`);
          console.log(JSON.stringify({class:cls.count,subclasses:subs.count,features:features.count,status:'SUPPORTED'},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: srd52-barbarian
          path: |
            packages/content/data/srd-5.2/classes.json
            packages/content/data/srd-5.2/class-features.json
            packages/content/data/srd-5.2/subclasses.json
            packages/content/data/srd-5.2/barbarian-coverage-audit.json
            packages/content/data/srd-5.2/barbarian-5etools-comparison.json
            packages/content/data/srd-5.2/barbarian-foundry-comparison.json
            packages/content/data/srd-5.2/media-coverage-audit.json
      - name: Persist Barbarian compendium on PR branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/content/data/srd-5.2/classes.json \
            packages/content/data/srd-5.2/class-features.json \
            packages/content/data/srd-5.2/subclasses.json \
            packages/content/data/srd-5.2/barbarian-coverage-audit.json \
            packages/content/data/srd-5.2/barbarian-5etools-comparison.json \
            packages/content/data/srd-5.2/barbarian-foundry-comparison.json \
            packages/content/data/srd-5.2/media-coverage-audit.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m 'Persist SRD 5.2 Barbarian compendium [skip ci]'
            git push origin HEAD:${{ github.head_ref }}
          fi
