<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b090c" />
  <title>Campanha · OracleRPG</title>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/campaign-runtime.css" />
  <link rel="stylesheet" href="/campaign-timeline.css" />
  <link rel="stylesheet" href="/campaign-chat.css" />
  <style>.runtime-field>span{color:var(--runtime-muted);font-size:6px}</style>
  <script src="/theme.js"></script>
  <script src="/system-registry.js" defer></script>
  <script src="/campaign-runtime.js" defer></script>
  <script src="/campaign-guide-context.js" defer></script>
  <script src="/campaign-state-effects.js" defer></script>
  <script src="/campaign-timeline.js" defer></script>
  <script src="/campaign-chat.js" defer></script>
</head>
<body>
  <main class="runtime-shell" data-campaign-runtime>
    <header class="runtime-topbar">
      <a href="/" class="runtime-back" data-runtime-menu aria-label="Início" title="Início">⌂</a>
      <div class="runtime-title"><strong data-runtime-campaign>OracleRPG</strong><small data-runtime-system></small></div>
      <div class="runtime-top-actions">
        <a href="/settings.html#api" class="runtime-top-action" data-runtime-api aria-label="Configurar API" title="Configurar API">⚙</a>
        <button type="button" class="runtime-top-action danger" data-runtime-reset aria-label="Reiniciar campanha" title="Reiniciar campanha">↻</button>
      </div>
    </header>

    <section class="runtime-stage" data-runtime-stage>
      <div class="runtime-stage-hud" data-runtime-hud></div>
      <div class="runtime-scene" data-runtime-scene></div>
    </section>

    <div class="runtime-scrim" data-runtime-scrim hidden></div>
    <section class="runtime-panels" data-runtime-panels aria-live="polite"></section>

    <nav class="runtime-dock" data-runtime-dock aria-label="Ferramentas da campanha">
      <button type="button" data-runtime-open="character"><span>♙</span><small>Personagem</small></button>
      <button type="button" data-runtime-open="inventory"><span>◇</span><small>Mochila</small></button>
      <button type="button" data-runtime-open="powers"><span>✦</span><small>Habilidades</small></button>
      <button type="button" data-runtime-open="journal"><span>✎</span><small>Diário</small></button>
      <button type="button" data-runtime-open="dice"><span>⚄</span><small>Dados</small></button>
      <button type="button" data-runtime-open="documents"><span>▤</span><small>Documentos</small></button>
    </nav>
  </main>
</body>
</html>
