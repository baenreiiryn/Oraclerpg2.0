<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b090c" />
  <title>OracleRPG</title>
  <style>
    @font-face{font-family:"Black Chancery";src:url("https://db.onlinewebfonts.com/t/753833d2833e9f73b56cffae357cf95f.woff2") format("woff2");font-display:swap}
    :root{color-scheme:dark;--bg:#0b090c;--surface:rgba(24,20,27,.9);--border:rgba(223,190,130,.18);--text:#f4eee4;--muted:#a69da8;--gold:#e7c580;--violet:#aa92d1}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,rgba(145,112,177,.16),transparent 31rem),radial-gradient(circle at 105% 42%,rgba(151,103,55,.09),transparent 25rem),linear-gradient(180deg,#100d12,#0a080b);overflow-x:hidden}.shell{width:min(100%,520px);min-height:100dvh;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 20px max(30px,env(safe-area-inset-bottom))}.brand{display:flex;justify-content:center;align-items:center;min-height:76px;margin-bottom:18px}.brand-mark{font:400 clamp(42px,12vw,58px)/.9 "Black Chancery",Georgia,serif;color:#f3eadb}.brand-mark span{color:var(--gold)}
    .section{margin-top:27px}.eyebrow{margin:0 0 2px;color:var(--gold);font:400 17px/1 "Black Chancery",Georgia,serif}.title{margin:0;font:400 32px/1.02 "Black Chancery",Georgia,serif}.caption{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.strip{display:grid;grid-auto-flow:column;grid-auto-columns:118px;gap:15px;overflow-x:auto;margin:0 -20px;padding:20px 20px 14px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}.token{border:0;background:transparent;color:inherit;text-align:center}.ring{width:108px;aspect-ratio:1;margin:0 auto 8px;border-radius:50%;padding:7px;position:relative;background:#090909;border:2px solid #020202;box-shadow:0 11px 22px rgba(0,0,0,.45)}.ring:before{content:"";position:absolute;inset:4px;border-radius:50%;border:2px solid rgba(90,87,80,.78);z-index:2}.portrait{width:100%;height:100%;border-radius:50%;display:block;background:radial-gradient(circle at 48% 27%,rgba(255,210,143,.22),transparent 22%),linear-gradient(145deg,#704334,#201419)}.token:nth-child(2) .portrait{background:linear-gradient(145deg,#344967,#11151d)}.token:nth-child(3) .portrait{background:linear-gradient(145deg,#35503b,#111814)}.token:nth-child(4) .portrait{background:linear-gradient(145deg,#4d3861,#18111f)}.campaign{display:block;font:400 19px/1 "Black Chancery",Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.character{display:block;margin-top:3px;color:var(--muted);font-size:11px}.divider{height:1px;margin:18px 0 0;background:linear-gradient(90deg,transparent,rgba(231,197,128,.16),transparent)}
    .actions{display:grid;gap:12px;margin-top:18px}.card{width:100%;min-height:82px;border:1px solid var(--border);border-radius:18px;padding:16px 17px;display:grid;grid-template-columns:46px 1fr 24px;align-items:center;gap:14px;color:inherit;text-align:left;background:linear-gradient(145deg,rgba(255,255,255,.034),transparent 58%),var(--surface);text-decoration:none}.icon{width:46px;aspect-ratio:1;display:grid;place-items:center;border-radius:14px;color:var(--gold);background:rgba(231,197,128,.075);border:1px solid rgba(231,197,128,.12);font-size:20px}.card.homebrew .icon{color:#c2ade2}.action-title{display:block;font:400 24px/1 "Black Chancery",Georgia,serif}.sub{display:block;margin-top:5px;color:var(--muted);font-size:11px;line-height:1.35}.chev{color:rgba(245,240,232,.35);font-size:22px}.note{margin:24px auto 0;max-width:360px;color:rgba(166,157,168,.62);font-size:10px;line-height:1.5;text-align:center}
  </style>
</head>
<body><main class="shell">
  <header class="brand"><div class="brand-mark">Oracle<span>RPG</span></div></header>
  <section class="section"><p class="eyebrow">Your stories</p><h1 class="title">Continue campaign</h1><p class="caption">Choose a character to return to the adventure.</p>
    <div class="strip"><button class="token"><span class="ring"><span class="portrait"></span></span><span class="campaign">Avernus</span><span class="character">Vaxii</span></button><button class="token"><span class="ring"><span class="portrait"></span></span><span class="campaign">Mytharyn</span><span class="character">Tenzai</span></button><button class="token"><span class="ring"><span class="portrait"></span></span><span class="campaign">Sword Coast</span><span class="character">Dio</span></button><button class="token"><span class="ring"><span class="portrait"></span></span><span class="campaign">Night City</span><span class="character">Kanami</span></button></div>
  </section><div class="divider"></div>
  <section class="section"><p class="eyebrow">Oracle</p><h2 class="title">What shall we create?</h2><div class="actions">
    <button class="card"><span class="icon">＋</span><span><span class="action-title">Start new campaign</span><span class="sub">Begin a new story in OracleRPG.</span></span><span class="chev">›</span></button>
    <button class="card homebrew"><span class="icon">⚗</span><span><span class="action-title">Homebrew</span><span class="sub">Create and organize your own content.</span></span><span class="chev">›</span></button>
    <a class="card" href="./settings.html"><span class="icon">⚙</span><span><span class="action-title">Settings</span><span class="sub">Preferences, account, and app appearance.</span></span><span class="chev">›</span></a>
  </div></section><p class="note">Mobile visual prototype. Campaign and creation actions are not connected yet.</p>
</main><script>localStorage.setItem('oraclerpg.locale','en');</script></body></html>
