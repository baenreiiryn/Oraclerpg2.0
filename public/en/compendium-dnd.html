<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b090c" />
  <title>Compendium · OracleRPG</title>
  <link rel="stylesheet" href="/compendium-ui.css" />
  <link rel="stylesheet" href="/compendium-item-cards.css" />
  <link rel="stylesheet" href="/compendium-sections.css" />
  <link rel="stylesheet" href="/compendium-overlays.css" />
  <link rel="stylesheet" href="/compendium-homebrew.css" />
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/compendium-theme-bridge.css" />
  <script src="/theme.js"></script>
</head>
<body>
<main class="shell">
  <header class="topbar"><a class="back" href="index.html" aria-label="Back">‹</a><div id="topTitle" class="top-title">Compendium</div><div></div></header>
  <section class="intro"><p id="eyebrow" class="eyebrow">Oracle Library</p><h1 id="pageTitle">Game content</h1><p id="introText"></p></section>
  <div class="tabs"><button id="tabSrd" class="tab active" data-mode="srd">SRD Compendium</button><button id="tabHomebrew" class="tab" data-mode="homebrew">Homebrew Compendium</button></div>
  <div class="toolbar"><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="search" type="search" placeholder="Search the compendium…" autocomplete="off"/></div><button id="add" class="add" hidden>＋ New</button></div>
  <div id="categories" class="categories" aria-label="Categories"></div>
  <div class="status"><span id="count">Loading…</span><span id="storage">SRD 5.2</span></div>
  <div id="list" class="list"><div class="loading">Loading compendium…</div></div>
  <p id="localNote" class="local-note"></p>
</main>
<div id="viewer" class="modal" role="dialog" aria-modal="true">
  <section class="sheet">
    <div class="sheet-head"><div><span id="viewerBadge" class="badge">SRD</span><h2 id="viewerTitle"></h2><p id="viewerMeta" class="sheet-sub"></p></div><button class="close" data-close="viewer" aria-label="Close">×</button></div>
    <div id="viewerVisual" class="visual-detail"></div>
    <div class="actions"><button id="clone" class="primary">Create Homebrew copy</button><button id="editViewer" class="secondary" hidden>Edit Homebrew</button></div>
    <details class="json-wrap"><summary id="rawSummary">View technical data (JSON)</summary><pre id="viewerJson" class="json"></pre></details>
  </section>
</div>
<div id="editor" class="modal" role="dialog" aria-modal="true">
  <section class="sheet">
    <div class="sheet-head"><div><span class="badge homebrew-badge">HOMEBREW</span><h2 id="editorTitle">Edit content</h2><p id="editorSub" class="sheet-sub"></p></div><button class="close" data-close="editor" aria-label="Close">×</button></div>
    <div class="field"><label id="nameLabel" for="editName">Name</label><input id="editName" /></div>
    <div class="field"><label id="categoryLabel" for="editCategory">Category</label><select id="editCategory"></select></div>
    <div class="field"><label id="dataLabel" for="editJson">Entity data</label><textarea id="editJson" spellcheck="false"></textarea></div>
    <div id="editError" class="error"></div><div class="actions"><button id="save" class="primary">Save</button><button id="cancel" class="secondary">Cancel</button><button id="delete" class="danger">Delete</button></div>
  </section>
</div>
<script src="/compendium-ui.js" defer></script>
<script src="/compendium-class-progression.js" defer></script>
<script src="/compendium-item-cards.js" defer></script>
<script src="/compendium-sections.js" defer></script>
<script src="/compendium-structured-text.js" defer></script>
<script src="/compendium-homebrew.js" defer></script>
</body>
</html>
